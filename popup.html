<!DOCTYPE html>

  <style>
    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      background-color: #0b132b;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h2 {
      text-align: center;
      color: #10b981;
      font-size: 15px;
      margin: 0 0 14px 0;
      letter-spacing: 1px;
      font-weight: 800;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }
    input[type="text"], select {
      width: 100%;
      padding: 8px;
      background-color: #1c2541;
      border: 1px solid #3a506b;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: #10b981;
    }
    .btn-start {
      width: 100%;
      padding: 10px;
      background-color: #10b981;
      color: #0b132b;
      border: none;
      border-radius: 6px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-start:hover {
      background-color: #059669;
      color: #ffffff;
    }
    .btn-logout-popup {
      width: 100%;
      padding: 8px;
      background-color: #450a0a;
      color: #f87171;
      border: 1px solid #ef4444;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }
    .btn-logout-popup:hover {
      background-color: #ef4444;
      color: #ffffff;
    }
    #status-container {
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
