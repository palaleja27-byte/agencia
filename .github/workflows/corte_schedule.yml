name: Auto Corte Turnos Cron

on:
  schedule:
    # Corre cada 2 horas en punto (00:00, 02:00, 04:00, etc. UTC y Colombia)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  trigger_auto_corte:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar endpoint de Auto Corte
        run: |
          curl -X POST "https://agencia-analytics.vercel.app/api/cron-corte" \
          -H "Content-Type: application/json"
